name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # vcpkg is preinstalled on GitHub windows runners; manifest mode
      # (vcpkg.json) installs spdlog and gtest during configure.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Spec 12.1: the hook DLL must be verified in-process before any
      # installation. This step never touches a live Explorer.
      - name: Selftest
        run: build/src/host/TrayMirror.exe --selftest
